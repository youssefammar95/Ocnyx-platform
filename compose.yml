x-ocnyx-env: &ocnyx-env
  MQTT_ENABLED: "true"
  MQTT_BROKER: "emqx"
  MQTT_PORT: "1883"
  MQTT_REQUIRE_BROKER_AUTH: "true"
  OCNYX_DEPLOYMENT: "staging"
  REDIS_URL: "redis://redis:6379/0"

x-ocnyx-app: &ocnyx-app
  image: ocnyx-app:local
  build:
    context: ../Ocnyx
    dockerfile: ../Ocnyx-platform/docker/Dockerfile
    args:
      VITE_SUPABASE_URL: $VITE_SUPABASE_URL
      VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
  env_file:
    - .env
  depends_on:
    emqx:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  emqx:
    image: emqx/emqx:5.8.6
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    <<: *ocnyx-app
    environment:
      <<: *ocnyx-env
      OCNYX_ROLE: "api"
    ports:
      - "8000:8000"
  worker:
    <<: *ocnyx-app
    environment:
      <<: *ocnyx-env
      OCNYX_ROLE: "worker"
  simulator:
    image: python:3.11-slim
    volumes:
      - ../Ocnyx/tools/ocnyx_sim:/sim:ro
      - ../Ocnyx/tests/prediction_validation/fixtures/training-industrial-pump.csv:/data/training.csv:ro
    working_dir: /sim
    environment:
      OCNYX_BASE_URL: "http://api:8000"
      OCNYX_API_KEY: ${OCNYX_API_KEY}
      OCNYX_MACHINE_ID: "sim-pump-01"
    command:
      - sh 
      - -c
      - > 
        pip install --quiet requests paho-mqtt python-dotenv &&
        python live_simulator.py
        --config scenarios/6d-prediction-eval.json
        --baseline-csv /data/training.csv
        --transport mqtt
        --state-file /tmp/state.json
        --scorecard-file /tmp/scorecard.json
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
